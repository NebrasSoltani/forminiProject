security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        # used to reload user from session & other features (e.g. switch_user)
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        main:
            lazy: true
            provider: app_user_provider
            user_checker: App\Security\EmailVerifiedUserChecker
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
                # Always redirect to 2FA if needed
                always_use_default_target_path: false
                default_target_path: accueil
            logout:
                path: app_logout
                # where to redirect after logout
                target: accueil
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                # Prevent redirect loops
                multi_factor: true

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied
    access_control:
        # Public routes - must come first
        - { path: ^/login$, role: PUBLIC_ACCESS }
        - { path: ^/register$, role: PUBLIC_ACCESS }
        - { path: ^/connect/, role: PUBLIC_ACCESS }
        - { path: ^/logout$, role: PUBLIC_ACCESS }
        # 2FA routes - allow access for authenticated users
        - { path: ^/2fa/login$, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/2fa_check$, role: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/2fa/, role: ROLE_USER }
        # Main app routes - exclude specific paths
        - { path: ^/accueil$, role: ROLE_USER }
        - { path: ^/dashboard$, role: ROLE_USER }
        - { path: ^/profile, role: ROLE_USER }
        - { path: ^/admin/, role: ROLE_ADMIN }
        - { path: ^/apprenant/, role: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
